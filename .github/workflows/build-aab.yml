name: Build AAB V80.40.3 CODE 804003 FINAL
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build from subfolder
        run: |
          cd measurement-hub-v80-40-3
          npm install --legacy-peer-deps
          chmod +x android/gradlew
          cd android && ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MeasurementHub-AAB-V80-40-3-CODE-804003-BN-8123456-8MB
          path: measurement-hub-v80-40-3/android/app/build/outputs/bundle/release/app-release.aab
