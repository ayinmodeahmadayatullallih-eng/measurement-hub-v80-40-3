name: Build REAL AAB Google SDK Fixed
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: FIX DOUBLE FOLDER - Move to ROOT
        run: |
          echo "BEFORE:"
          ls -la
          # If file is inside double folder, move it out
          if [ -d "measurement-hub-v80-40-3" ]; then
            echo "Found subfolder, moving files to ROOT..."
            mv measurement-hub-v80-40-3/* . 2>/dev/null || true
            mv measurement-hub-v80-40-3/.* . 2>/dev/null || true
          fi
          if [ -d "measurement-hub-v80-40-3-main" ]; then
            mv measurement-hub-v80-40-3-main/* . -f
          fi
          echo "AFTER FIX:"
          ls -la
          echo "Checking package.json:"
          ls -la package.json
          echo "Checking android:"
          ls -la android

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3

      - name: Install with Google SDK
        run: npm install --legacy-peer-deps

      - run: npx cap sync android

      - name: Build REAL AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
          ls -lh app/build/outputs/bundle/release/

      - uses: actions/upload-artifact@v4
        with:
          name: GTV-UP-REAL-AAB-FIXED
          path: android/app/build/outputs/bundle/release/*.aab
